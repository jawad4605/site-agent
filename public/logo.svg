<svg xmlns="http://www.w3.org/2000/svg" viewBox="6 2 60 60" width="512" height="512" xmlns:c2pa="http://c2pa.org/manifest">
  <defs>
    <linearGradient id="t" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#67e8f9"/><stop offset="1" stop-color="#22d3ee"/></linearGradient>
    <linearGradient id="l" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#a78bfa"/><stop offset="1" stop-color="#7c3aed"/></linearGradient>
    <linearGradient id="r" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#60a5fa"/><stop offset="1" stop-color="#2563eb"/></linearGradient>
  </defs>
  <g stroke="#09090b" stroke-width="1.4" stroke-linejoin="round">
    <!-- big cube with a missing corner block -->
    <polygon points="10,20 32,32 32,56 10,44" fill="url(#l)"/>
    <polygon points="43,26 32,32 32,56 54,44 54,32 43,38" fill="url(#r)"/>
    <polygon points="32,8 43,14 32,20 43,26 32,32 10,20" fill="url(#t)"/>
    <!-- the empty slot -->
    <polygon points="43,26 54,32 43,38 32,32" fill="#0e7490"/>
    <polygon points="43,14 32,20 32,32 43,26" fill="#1e3a8a"/>
    <!-- block sliding into place -->
    <g transform="translate(10,-5.5)">
      <polygon points="32,20 43,26 43,38 32,32" fill="url(#l)"/>
      <polygon points="54,20 43,26 43,38 54,32" fill="url(#r)"/>
      <polygon points="43,14 54,20 43,26 32,20" fill="url(#t)"/>
    </g>
  </g>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
